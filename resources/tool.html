<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <!-- One file serves every /resources/tools/<slug> (rewrites in vercel.json / serve.json).
       In production api/tool-page.js replaces everything between the TOOL_META markers with the
       per-slug title, description, canonical, og:url and og:image (/og/tools/<slug>.png) so crawlers
       that do not run JS get correct tags. The generic tags below are the static fallback (and the
       local `serve` result); tool.js also updates them client-side once the slug resolves. -->
  <!--TOOL_META-->
  <title>Tellus Resources · Resource profile</title>
  <meta name="description" content="Resource profile from the Tellus Resources catalog: free plan, use cases and alternatives." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://telluscoop.org/resources" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tellus Cooperative" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="es_LA" />
  <meta property="og:url" content="https://telluscoop.org/resources" />
  <meta property="og:title" content="Tellus Resources · Resource profile" />
  <meta property="og:description" content="Resource profile from the Tellus Resources catalog: free plan, use cases and alternatives." />
  <meta property="og:image" content="https://telluscoop.org/og/og-resources.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Tellus Resources: the free part of the internet" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@TellusCoop" />
  <meta name="twitter:title" content="Tellus Resources · Resource profile" />
  <meta name="twitter:description" content="Resource profile from the Tellus Resources catalog: free plan, use cases and alternatives." />
  <meta name="twitter:image" content="https://telluscoop.org/og/og-resources.png" />
  <meta name="twitter:image:alt" content="Tellus Resources: the free part of the internet" />
  <!--/TOOL_META-->

  <link rel="icon" type="image/png" href="/uploads/TellusCooperative%20ICON.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="/resources/tools.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400,0,1;1,9..144,400,0,1&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/shared/tokens.css" />
  <link rel="stylesheet" href="/shared/site.css" />
  <link rel="stylesheet" href="/resources/resources.css" />
</head>
<body id="top">
  <a class="tl-skip" href="#main" data-i18n-skip>Skip to content</a>
  <div data-tellus="nav" data-variant="main" data-lang="auto"></div>

  <main id="main"><div id="tp-root"></div></main>

  <div data-tellus="ribbon" data-section-theme="cielo"></div>
  <div data-tellus="footer" data-lang="auto"></div>

  <script src="/shared/site.js"></script>
  <script src="/resources/category-content.js"></script>
  <script src="/resources/tool.js"></script>
</body>
</html>

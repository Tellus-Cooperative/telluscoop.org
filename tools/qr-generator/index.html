<body id="top">
  <a class="tl-skip" href="#main">Saltar al contenido</a>
  <div data-tellus="nav" data-variant="main" data-lang="es"></div>

<main id="main" class="qr-page" data-section-theme="claro"><div class="qr-wrap">
  <h1 class="t-h2">Generador de códigos QR</h1>
  <p class="qr-sub t-lead">Pegue un enlace, agregue una imagen si quiere y descárguelo.</p>

  <div class="qr-card">
    <div class="qr-form">
      <label class="qr-label" for="qr-url">Enlace</label>
      <input id="qr-url" type="url" inputmode="url" placeholder="https://telluscoop.org" autocomplete="off" spellcheck="false" />

      <span class="qr-label" id="qr-image-label">Imagen al centro <em>(opcional)</em></span>
      <div class="qr-image-row">
        <label class="qr-btn qr-btn-ghost" for="qr-image">Elegir imagen</label>
        <input id="qr-image" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" aria-labelledby="qr-image-label" hidden />
        <span id="qr-image-name" class="qr-image-name">Sin imagen</span>
        <button id="qr-image-clear" type="button" class="qr-link" hidden>Quitar</button>
      </div>
      <p id="qr-msg" class="qr-msg" role="status" aria-live="polite"></p>
    </div>

    <div class="qr-preview">
      <div id="qr-canvas" class="qr-canvas" role="img" aria-label="Vista previa del código QR"></div>
      <p id="qr-empty" class="qr-empty">Su código QR aparecerá aquí.</p>
      <div class="qr-actions">
        <button type="button" class="qr-btn" data-download="png" disabled>Descargar PNG</button>
        <button type="button" class="qr-btn qr-btn-ghost" data-download="svg" disabled>Descargar SVG</button>
      </div>
    </div>
  </div>
</div></main>

<div data-tellus="footer" data-lang="es"></div>

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
<script src="/shared/site.js"></script>
<script src="/tools/qr-generator/qr.js"></script>
</body>
</html>
